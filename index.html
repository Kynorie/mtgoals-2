const STORAGE_KEY_THEME = 'monkeytype_goals_theme_v2';
const STORAGE_KEY_CUSTOM = 'monkeytype_goals_custom_themes';
const STORAGE_KEY_AUTOMATIC_MODE = 'monkeytype_goals_automatic_mode';

function getAutomaticMode() {
  try { return localStorage.getItem(STORAGE_KEY_AUTOMATIC_MODE) || 'time'; }
  catch (e) { return 'time'; }
}

function setAutomaticMode(mode) {
  try { localStorage.setItem(STORAGE_KEY_AUTOMATIC_MODE, mode); }
  catch (e) {}
}

function resolveOsThemeId() {
  if (typeof window === 'undefined' || !window.matchMedia) return 'default';
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'default' : 'default-light';
}

function loadCustomThemes() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY_CUSTOM));
    return raw && typeof raw === 'object' ? raw : {};
  } catch {
    return {};
  }
}

function saveCustomThemes(customThemes) {
  try { localStorage.setItem(STORAGE_KEY_CUSTOM, JSON.stringify(customThemes)); }
  catch (e) {}
}

function getAllThemes() {
  return { ...THEMES, ...loadCustomThemes() };
}

function hexToRgb(hex) {
  const clean = hex.replace('#', '');
  const full = clean.length === 3
    ? clean.split('').map(c => c + c).join('')
    : clean;
  const num = parseInt(full, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}

function lighten(hex, amount) {
  const { r, g, b } = hexToRgb(hex);
  const adj = v => Math.min(255, Math.round(v + (255 - v) * amount));
  return '#' + [adj(r), adj(g), adj(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}

function toRgbaString(hex, alpha) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

function relativeLuminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}

const DARK_TEXT_TIERS = {
  '--mt-text-primary': 'rgba(255,255,255,1)',
  '--mt-text-secondary': 'rgba(255,255,255,0.8)',
  '--mt-text-tertiary': 'rgba(255,255,255,0.45)',
  '--mt-text-faint': 'rgba(255,255,255,0.3)',
};

const LIGHT_TEXT_TIERS = {
  '--mt-text-primary': 'rgba(20,20,20,1)',
  '--mt-text-secondary': 'rgba(20,20,20,0.75)',
  '--mt-text-tertiary': 'rgba(20,20,20,0.5)',
  '--mt-text-faint': 'rgba(20,20,20,0.35)',
};

function buildThemeFromFriendlyValues(values) {
  const accent = values.accentColor;
  const textTiers = relativeLuminance(values.backgroundColor) > 0.5 ? LIGHT_TEXT_TIERS : DARK_TEXT_TIERS;
  return {
    name: values.themeName,
    '--mt-accent': accent,
    '--mt-accent-hover': lighten(accent, 0.12),
    '--mt-accent-muted': toRgbaString(accent, 0.12),
    '--mt-bg-primary': values.backgroundColor,
    '--mt-bg-card': values.cardBackgroundColor,
    '--mt-bg-card-hover': values.cardBackgroundHoverColor,

    ctx.quadraticCurveTo(0, size, 0, size - radius);

    ctx.quadraticCurveTo(0, 0, radius, 0);

<body class="pre-load">

<div id="loadingScreen">
  <div class="loading-title">Monkeytype Goals 2</div>
  <div class="loading-bar-track">
    <div class="loading-bar-fill" id="loadingBarFill"></div>
  </div>
</div>

<div id="toastStack"></div>

<script>
(function() {
  const barFill = document.getElementById('loadingBarFill');
  const screen = document.getElementById('loadingScreen');
  const TOTAL_TASKS = 4;
  let completed = 0;

  function taskDone() {
    completed = Math.min(TOTAL_TASKS, completed + 1);
    barFill.style.width = (completed / TOTAL_TASKS * 100) + '%';
    if (completed >= TOTAL_TASKS) finishLoading();
  }

  function finishLoading() {
    setTimeout(() => {
      screen.classList.add('fade-out');
      document.body.classList.remove('pre-load');
      screen.addEventListener('transitionend', () => screen.remove(), { once: true });
    }, 150);
  }

  const googleFontLink = document.querySelector('link[href*="fonts.googleapis.com"]');
  if (googleFontLink) {
    if (googleFontLink.sheet) taskDone();
    else googleFontLink.addEventListener('load', taskDone, { once: true });
  } else {
    taskDone();
  }

  taskDone();

  function waitForCustomFont() {
    if (!document.fonts) { taskDone(); return; }
    let settled = false;
    function markSettled() {
      if (settled) return;
      settled = true;
      taskDone();
    }
    document.fonts.ready.then(() => {
      if (document.fonts.check('16px FuturaCyrillicMedium')) markSettled();
    }).catch(markSettled);
    const pollStart = Date.now();
    const poll = setInterval(() => {
      if (document.fonts.check('16px FuturaCyrillicMedium') || Date.now() - pollStart > 5000) {
        clearInterval(poll);
        markSettled();
      }
    }, 100);
  }
  waitForCustomFont();

  window.addEventListener('load', taskDone, { once: true });

  setTimeout(() => { while (completed < TOTAL_TASKS) taskDone(); }, 6000);
})();
</script>

function loadGoals() {
  try { return JSON.parse(localStorage.getItem(MT_STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveGoals(goals) {
  try { localStorage.setItem(MT_STORAGE_KEY, JSON.stringify(goals)); }
  catch (e) {}
}

const MT_PROGRESS_KEY = 'monkeytype_goals_progress';

function loadProgressMap() {
  try { return JSON.parse(localStorage.getItem(MT_PROGRESS_KEY)) || {}; }
  catch { return {}; }
}

function saveProgressMap(map) {
  try { localStorage.setItem(MT_PROGRESS_KEY, JSON.stringify(map)); }
  catch (e) {}
}

function getGoalProgress(id) {
  const map = loadProgressMap();
  return typeof map[id] === 'number' ? map[id] : 0;
}

function setGoalProgress(id, value) {
  const map = loadProgressMap();
  map[id] = value;
  saveProgressMap(map);
}

function deleteGoalProgress(id) {
  const map = loadProgressMap();
  delete map[id];
  saveProgressMap(map);
}

const MT_FOLDERS_KEY = 'monkeytype_goals_folders';

function loadFolders() {
  try { return JSON.parse(localStorage.getItem(MT_FOLDERS_KEY)) || []; }
  catch { return []; }
}

function saveFolders(folders) {
  try { localStorage.setItem(MT_FOLDERS_KEY, JSON.stringify(folders)); }
  catch (e) {}
}

function createFolder(name, goalIds) {
  const folders = loadFolders();
  const folder = { id: Date.now().toString(), name, goalIds: [...goalIds], expanded: false };
  folders.push(folder);
  saveFolders(folders);
  return folder;
}

function deleteFolder(folderId) {
  saveFolders(loadFolders().filter(f => f.id !== folderId));
}

function renameFolder(folderId, newName) {
  const folders = loadFolders();
  const folder = folders.find(f => f.id === folderId);
  if (folder) { folder.name = newName; saveFolders(folders); }
}

function setFolderExpanded(folderId, expanded) {
  const folders = loadFolders();
  const folder = folders.find(f => f.id === folderId);
  if (folder) { folder.expanded = expanded; saveFolders(folders); }
}

function removeGoalFromAllFolders(goalId) {
  const folders = loadFolders();
  folders.forEach(f => { f.goalIds = f.goalIds.filter(id => id !== goalId); });
  saveFolders(folders);
}

function logCompletion(text) {
  const entries = loadHistory();
  entries.push({ text, completedAt: Date.now() });
  saveHistory(entries);
}

function getCompletionsForDate(year, month, day) {
  return loadHistory().filter(e => {
    const d = new Date(e.completedAt);
    return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
  });
}

function updateDragHandles() {
  const cards = getCards();
  const show = cards.length >= 2;
  cards.forEach(card => {
    const handle = card.querySelector('.drag-handle');
    if (handle) {
      if (show) handle.classList.remove('hidden');
      else handle.classList.add('hidden');
    }
  });
}

let dragSrc = null, dragId = null, indicator = null;

function getCards() { return [...container.querySelectorAll('.goal-card')]; }
function removeIndicator() { if (indicator) { indicator.remove(); indicator = null; } }
function insertIndicatorBefore(el) {
  removeIndicator();
  indicator = document.createElement('div');
  indicator.className = 'drop-indicator';
  container.insertBefore(indicator, el);
}
function insertIndicatorAfter(el) {
  removeIndicator();
  indicator = document.createElement('div');
  indicator.className = 'drop-indicator';
  el.after(indicator);
}

function onHandleMouseDown(e, card, id) {
  e.preventDefault();
  dragSrc = card; dragId = id;
  card.classList.add('dragging');
  function onMouseMove(ev) {
    const cards = getCards().filter(c => c !== dragSrc);
    removeIndicator();
    let placed = false;
    for (const c of cards) {
      const rect = c.getBoundingClientRect();
      if (ev.clientY < rect.top + rect.height / 2) { insertIndicatorBefore(c); placed = true; break; }
    }
    if (!placed && cards.length > 0) insertIndicatorAfter(cards[cards.length - 1]);
  }
  function onMouseUp() {
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
    finishDrag();
  }
  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup', onMouseUp);
}

function onHandleTouchStart(e, card, id) {
  dragSrc = card; dragId = id;
  card.classList.add('dragging');
  function onTouchMove(ev) {
    ev.preventDefault();
    const touch = ev.touches[0];
    const cards = getCards().filter(c => c !== dragSrc);
    removeIndicator();
    let placed = false;
    for (const c of cards) {
      const rect = c.getBoundingClientRect();
      if (touch.clientY < rect.top + rect.height / 2) { insertIndicatorBefore(c); placed = true; break; }
    }
    if (!placed && cards.length > 0) insertIndicatorAfter(cards[cards.length - 1]);
  }
  function onTouchEnd() {
    card.removeEventListener('touchmove', onTouchMove);
    card.removeEventListener('touchend', onTouchEnd);
    finishDrag();
  }
  card.addEventListener('touchmove', onTouchMove, { passive: false });
  card.addEventListener('touchend', onTouchEnd);
}

function finishDrag() {
  if (!dragSrc) return;
  dragSrc.classList.remove('dragging');
  if (indicator) { container.insertBefore(dragSrc, indicator); removeIndicator(); }
  dragSrc = null; dragId = null;
  const newOrder = getCards().map(c => c.dataset.id);
  const goals = loadGoals();
  const map = Object.fromEntries(goals.map(g => [g.id, g]));
  saveGoals(newOrder.map(id => map[id]).filter(Boolean));
}

function getAgeLabel(createdAt) {
  if (!createdAt) return null;
  const ms = Date.now() - createdAt;
  const minutes = Math.floor(ms / 60000);
  const hours = Math.floor(ms / 3600000);
  const days = Math.floor(ms / 86400000);
  if (minutes < 1) return 'made just now';
  if (minutes < 60) return `made ${minutes} minute${minutes !== 1 ? 's' : ''} ago`;
  if (hours < 24) return `made ${hours} hour${hours !== 1 ? 's' : ''} ago`;
  if (days < 30) return `made ${days} day${days !== 1 ? 's' : ''} ago`;
  const months = Math.floor(days / 30);
  if (months < 12) return `made ${months} month${months !== 1 ? 's' : ''} ago`;
  const years = Math.floor(months / 12);
  return `made ${years} year${years !== 1 ? 's' : ''} ago`;
}

function isStale(createdAt) {
  if (!createdAt) return false;
  return Date.now() - createdAt > 30 * 24 * 60 * 60 * 1000;
}

const GOAL_SUGGESTIONS = [
  'Get 150wpm in 60s',
  'Beat my previous PB on 60s',
  'Hit 99% accuracy on a 30s test',
  'Type without looking at the keyboard',
  'Finish a 5-minute test without slowing down',
];

function updateEmptyState() {
  const existing = container.querySelector('.empty-state');
  const hasCards = getCards().length > 0;
  if (hasCards && existing) { existing.remove(); return; }
  if (!hasCards && !existing) {
    const el = document.createElement('div');
    el.className = 'empty-state';

    const label = document.createElement('div');
    label.className = 'empty-state-label';
    label.textContent = 'No goals yet. Try one of these:';
    el.appendChild(label);

    const list = document.createElement('div');
    list.className = 'goal-suggestions';

    GOAL_SUGGESTIONS.forEach(text => {
      const btn = document.createElement('button');
      btn.className = 'goal-suggestion';
      btn.textContent = text;
      btn.addEventListener('click', () => {
        createGoal(text);
        list.remove();
        label.remove();
      });
      list.appendChild(btn);
    });

    el.appendChild(list);
    container.appendChild(el);
  }
}

function showStalePopup(id, ageBtn) {
  const existing = document.getElementById('stale-popup-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'stale-popup-overlay';
  Object.assign(overlay.style, {
    position: 'fixed', inset: '0', background: 'rgba(0,0,0,0.6)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    zIndex: '99999', animation: 'fadeIn 0.15s ease',
  });

  const box = document.createElement('div');
  box.className = 'modal-box';

  const p = document.createElement('p');
  p.textContent = 'Are you still working on this goal?';

  const actions = document.createElement('div');
  actions.className = 'modal-actions';

  const yesBtn = document.createElement('button');
  yesBtn.className = 'modal-yes-btn';
  yesBtn.textContent = 'Yes';

  const noBtn = document.createElement('button');
  noBtn.className = 'modal-no-btn';
  noBtn.textContent = 'No';

  yesBtn.addEventListener('click', () => {
    overlay.remove();
    const goals = loadGoals();
    const idx = goals.findIndex(g => g.id === id);
    if (idx !== -1) {
      goals[idx].createdAt = Date.now();
      saveGoals(goals);
    }
    ageBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 7V12L9.5 13.5M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="age-tooltip">made just now</span>`;
    ageBtn.classList.remove('stale');
    ageBtn.style.cursor = 'default';
  });

  noBtn.addEventListener('click', () => {
    overlay.remove();
    const card = container.querySelector(`.goal-card[data-id="${id}"]`);
    if (card) {
      card.classList.add('fading');
      card.addEventListener('animationend', () => {
        card.remove();
        saveGoals(loadGoals().filter(g => g.id !== id));
        updateDragHandles();
        updateEmptyState();
      });
    }
  });

  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', esc); }
  });

  actions.appendChild(yesBtn);
  actions.appendChild(noBtn);
  box.appendChild(p);
  box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function buildGoalCardElement(text, id, createdAt, onDeleted) {
  const card = document.createElement('div');
  card.className = 'goal-card';
  card.dataset.id = id;

  const textEl = document.createElement('span');
  textEl.className = 'goal-text';
  textEl.textContent = text;

  const actions = document.createElement('div');
  actions.className = 'goal-card-actions';

  const editBtn = document.createElement('button');
  editBtn.className = 'edit-btn';
  editBtn.title = 'Edit goal';
  editBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M8.56078 20.2501L20.5608 8.25011L15.7501 3.43945L3.75012 15.4395V20.2501H8.56078ZM15.7501 5.56077L18.4395 8.25011L16.5001 10.1895L13.8108 7.50013L15.7501 5.56077ZM12.7501 8.56079L15.4395 11.2501L7.93946 18.7501H5.25012L5.25012 16.0608L12.7501 8.56079Z" fill="currentColor"></path></svg>`;
  editBtn.addEventListener('click', () => showEditRow(card, id, textEl.textContent));

  const ageBtn = document.createElement('button');
  ageBtn.className = 'age-btn';
  const stale = isStale(createdAt);
  const ageLabel = getAgeLabel(createdAt) || 'made just now';
  if (stale) {
    ageBtn.classList.add('stale');
    ageBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="17" r="1" fill="currentColor"></circle><path d="M12 10L12 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3.44722 18.1056L10.2111 4.57771C10.9482 3.10361 13.0518 3.10362 13.7889 4.57771L20.5528 18.1056C21.2177 19.4354 20.2507 21 18.7639 21H5.23607C3.7493 21 2.78231 19.4354 3.44722 18.1056Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="age-tooltip">${ageLabel}</span>`;
    ageBtn.addEventListener('click', () => showStalePopup(id, ageBtn));
  } else {
    ageBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 7V12L9.5 13.5M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="age-tooltip">${ageLabel}</span>`;
  }

  const delBtn = document.createElement('button');
  delBtn.className = 'delete-btn';
  delBtn.title = 'Remove goal';
  delBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M21.5821 5.54289C21.9726 5.93342 21.9726 6.56658 21.5821 6.95711L10.2526 18.2867C9.86452 18.6747 9.23627 18.6775 8.84475 18.293L2.29929 11.8644C1.90527 11.4774 1.89956 10.8443 2.28655 10.4503C2.67354 10.0562 3.30668 10.0505 3.70071 10.4375L9.53911 16.1717L20.1679 5.54289C20.5584 5.15237 21.1916 5.15237 21.5821 5.54289Z" fill="currentColor"/></svg>`;
  delBtn.addEventListener('click', () => deleteGoalCard(card, id, onDeleted, true));

  const progressFill = document.createElement('div');
  progressFill.className = 'goal-progress-fill';

  const progressInput = document.createElement('input');
  progressInput.className = 'progress-input';
  progressInput.type = 'text';
  progressInput.inputMode = 'numeric';
  progressInput.maxLength = 3;
  progressInput.placeholder = '0';

  const percentSign = document.createElement('span');
  percentSign.className = 'progress-percent-sign';
  percentSign.textContent = '%';

  const storedProgress = getGoalProgress(id);
  setProgressDisplay(progressFill, progressInput, storedProgress, false);

  progressInput.addEventListener('input', () => {
    progressInput.value = progressInput.value.replace(/[^0-9]/g, '').slice(0, 3);
  });

  progressInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const raw = progressInput.value.trim();
    if (raw === '') { progressInput.blur(); return; }
    const value = parseInt(raw, 10);
    if (value >= 100) {
      deleteGoalCard(card, id, onDeleted, true);
      return;
    }
    setGoalProgress(id, value);
    setProgressDisplay(progressFill, progressInput, value, true);
    progressInput.blur();
  });

  progressInput.addEventListener('blur', () => {
    const raw = progressInput.value.trim();
    const value = raw === '' ? 0 : Math.min(99, parseInt(raw, 10) || 0);
    setGoalProgress(id, value);
    setProgressDisplay(progressFill, progressInput, value, true);
  });

  const handle = document.createElement('button');
  handle.className = 'drag-handle';
  handle.title = 'Drag to reorder';
  handle.innerHTML = `<span></span><span></span><span></span>`;
  handle.addEventListener('mousedown', e => onHandleMouseDown(e, card, id));
  handle.addEventListener('touchstart', e => onHandleTouchStart(e, card, id), { passive: true });

  actions.appendChild(ageBtn);
  actions.appendChild(editBtn);
  actions.appendChild(progressInput);
  actions.appendChild(percentSign);
  actions.appendChild(delBtn);
  card.appendChild(handle);
  card.appendChild(textEl);
  card.appendChild(actions);
  card.appendChild(progressFill);
  return card;
}

function renderGoal(text, id, createdAt) {
  const card = buildGoalCardElement(text, id, createdAt, null);
  container.appendChild(card);
  updateDragHandles();
  updateEmptyState();
}

function deleteGoalCard(card, id, onDeleted, isCompletion) {
  launchConfetti();
  const goalText = card.querySelector('.goal-text')?.textContent || '';
  card.classList.add('fading');
  card.addEventListener('animationend', () => {
    card.remove();
    saveGoals(loadGoals().filter(g => g.id !== id));
    deleteGoalProgress(id);
    removeGoalFromAllFolders(id);
    if (isCompletion && goalText) logCompletion(goalText);
    updateDragHandles();
    updateEmptyState();
    if (onDeleted) onDeleted();
  });
}

function renderAllFolders() {
  container.querySelectorAll('.folder-card').forEach(el => el.remove());
  const folders = loadFolders();
  folders.slice().reverse().forEach(folder => {
    const folderEl = buildFolderCardElement(folder);
    container.insertBefore(folderEl, addRow.nextSibling);
  });
}

function buildFolderCardElement(folder) {
  const folderEl = document.createElement('div');
  folderEl.className = 'folder-card';
  if (folder.expanded) folderEl.classList.add('expanded');
  folderEl.dataset.id = folder.id;

  const header = document.createElement('div');
  header.className = 'folder-header';

  const chevron = document.createElement('svg');
  chevron.setAttribute('viewBox', '0 0 24 24');
  chevron.setAttribute('fill', 'none');
  chevron.classList.add('folder-chevron');
  chevron.innerHTML = '<path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>';

  const nameEl = document.createElement('span');
  nameEl.className = 'folder-name';
  nameEl.textContent = folder.name;

  const countEl = document.createElement('span');
  countEl.className = 'folder-count';
  countEl.textContent = folder.goalIds.length;

  const headerActions = document.createElement('div');
  headerActions.className = 'folder-header-actions';

  const renameBtn = document.createElement('button');
  renameBtn.className = 'folder-icon-btn';
  renameBtn.title = 'Rename folder';
  renameBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M8.56078 20.2501L20.5608 8.25011L15.7501 3.43945L3.75012 15.4395V20.2501H8.56078ZM15.7501 5.56077L18.4395 8.25011L16.5001 10.1895L13.8108 7.50013L15.7501 5.56077ZM12.7501 8.56079L15.4395 11.2501L7.93946 18.7501H5.25012L5.25012 16.0608L12.7501 8.56079Z" fill="currentColor"></path></svg>`;
  renameBtn.addEventListener('click', e => {
    e.stopPropagation();
    showFolderRenamePrompt(folder.id, folder.name, nameEl);
  });

  const deleteBtn = document.createElement('button');
  deleteBtn.className = 'folder-icon-btn';
  deleteBtn.title = 'Delete folder';
  deleteBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M21.5821 5.54289C21.9726 5.93342 21.9726 6.56658 21.5821 6.95711L10.2526 18.2867C9.86452 18.6747 9.23627 18.6775 8.84475 18.293L2.29929 11.8644C1.90527 11.4774 1.89956 10.8443 2.28655 10.4503C2.67354 10.0562 3.30668 10.0505 3.70071 10.4375L9.53911 16.1717L20.1679 5.54289C20.5584 5.15237 21.1916 5.15237 21.5821 5.54289Z" fill="currentColor"/></svg>`;
  deleteBtn.addEventListener('click', e => {
    e.stopPropagation();
    deleteFolder(folder.id);
    folderEl.remove();
  });

  header.addEventListener('click', () => {
    const nowExpanded = !folderEl.classList.contains('expanded');
    folderEl.classList.toggle('expanded', nowExpanded);
    setFolderExpanded(folder.id, nowExpanded);
  });

  headerActions.appendChild(renameBtn);
  headerActions.appendChild(deleteBtn);
  header.appendChild(chevron);
  header.appendChild(nameEl);
  header.appendChild(countEl);
  header.appendChild(headerActions);

  const body = document.createElement('div');
  body.className = 'folder-body';
  renderFolderBody(body, folder, countEl, folderEl);

  folderEl.appendChild(header);
  folderEl.appendChild(body);
  return folderEl;
}

function renderFolderBody(body, folder, countEl, folderEl) {
  body.innerHTML = '';
  const allGoals = loadGoals();
  const memberGoals = folder.goalIds
    .map(gid => allGoals.find(g => g.id === gid))
    .filter(Boolean);

  countEl.textContent = memberGoals.length;

  if (memberGoals.length === 0) {
    const note = document.createElement('div');
    note.className = 'folder-empty-note';
    note.textContent = 'No goals in this folder.';
    body.appendChild(note);
    return;
  }

  memberGoals.forEach(g => {
    const card = buildGoalCardElement(g.text, g.id, g.createdAt, () => {
      renderFolderBody(body, getFolder(folder.id) || { goalIds: [] }, countEl, folderEl);
    });
    body.appendChild(card);
  });
}

function getFolder(folderId) {
  return loadFolders().find(f => f.id === folderId);
}

function showFolderRenamePrompt(folderId, currentName, nameEl) {
  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentName;
  input.maxLength = 50;
  input.className = 'folder-name-input';
  input.style.fontSize = '0.88rem';
  nameEl.replaceWith(input);
  input.focus();
  input.select();

  function commit() {
    const newName = input.value.trim().slice(0, 50) || currentName;
    renameFolder(folderId, newName);
    nameEl.textContent = newName;
    input.replaceWith(nameEl);
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { nameEl.textContent = currentName; input.replaceWith(nameEl); }
  });
  input.addEventListener('blur', commit);
  input.addEventListener('click', e => e.stopPropagation());
}

function setProgressDisplay(fillEl, inputEl, value, animate) {
  fillEl.style.transition = animate ? 'width 0.4s ease' : 'none';
  fillEl.style.width = value + '%';
  inputEl.value = value > 0 ? String(value) : '';
}

function showAddRowButtons() {
  addBtn.style.display = '';
  folderBtn.style.display = '';
  if (!isBetterTopbarEnabled()) settingsBtn.style.display = '';
  requestAnimationFrame(() => {
    addBtn.classList.remove('collapsing');
  });
}

function createGoal(text) {
  const id = Date.now().toString();
  const createdAt = Date.now();
  const goals = loadGoals();
  goals.push({ id, text, createdAt });
  saveGoals(goals);
  renderGoal(text, id, createdAt);
  return id;
}

function showInputRow() {
  addBtn.classList.add('collapsing');
  folderBtn.style.display = 'none';
  settingsBtn.style.display = 'none';

  const row = document.createElement('div');
  row.className = 'goal-input-row';

  const ta = document.createElement('textarea');
  ta.placeholder = 'Type your goal here...';
  ta.maxLength = MAX;

  const actionsEl = document.createElement('div');
  actionsEl.className = 'input-actions';

  const pinBtn = document.createElement('button');
  pinBtn.className = 'pin-btn disabled';
  pinBtn.textContent = 'Set goal';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'cancel-btn';
  cancelBtn.textContent = 'Cancel';

  const counterStack = document.createElement('div');
  counterStack.className = 'counter-stack';

  const counter = document.createElement('span');
  counter.className = 'char-counter';
  counter.textContent = `0/${MAX}`;

  const wordCounter = document.createElement('span');
  wordCounter.className = 'word-counter under';
  wordCounter.textContent = `0/${MIN_LETTERS}`;

  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
    counter.textContent = `${ta.value.length}/${MAX}`;
    const letters = ta.value.trim().length;
    if (letters < MIN_LETTERS) wordCounter.textContent = `${letters}/${MIN_LETTERS}`;
    if (letters >= MIN_LETTERS) {
      wordCounter.classList.remove('under');
      wordCounter.classList.add('met');
      pinBtn.classList.remove('disabled');
    } else {
      wordCounter.classList.remove('met');
      wordCounter.classList.add('under');
      pinBtn.classList.add('disabled');
    }
  });

  function pinGoal() {
    const text = ta.value.trim();
    if (text.length < MIN_LETTERS) return;
    if (!text) { row.remove(); showAddRowButtons(); return; }
    createGoal(text);
    row.remove();
    showAddRowButtons();
  }

  function cancelGoal() { row.remove(); showAddRowButtons(); }

  pinBtn.addEventListener('click', pinGoal);
  cancelBtn.addEventListener('click', cancelGoal);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); pinGoal(); }
    if (e.key === 'Escape') cancelGoal();
  });

  counterStack.appendChild(counter);
  counterStack.appendChild(wordCounter);
  actionsEl.appendChild(counterStack);
  actionsEl.appendChild(pinBtn);
  actionsEl.appendChild(cancelBtn);
  row.appendChild(ta);
  row.appendChild(actionsEl);
  container.insertBefore(row, container.firstChild);
  ta.focus();

  setTimeout(() => {
    addBtn.style.display = 'none';
  }, 280);
}

document.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  if (e.key === 'g' && tag !== 'TEXTAREA' && tag !== 'INPUT') {
    e.preventDefault();
    showInputRow();
  }
});

function launchConfetti() {
  if (typeof confetti !== 'function') return;
  const defaults = { particleCount: 130, spread: 120, colors: ['#e2b714', '#0096FF', '#FF69B4'] };
  confetti({ ...defaults, angle: 60, origin: { x: 0, y: 1 } });
  confetti({ ...defaults, angle: 120, origin: { x: 1, y: 1 } });
}

function showEditRow(card, id, currentText) {
  const editRow = document.createElement('div');
  editRow.className = 'goal-edit-row';

  const ta = document.createElement('textarea');
  ta.value = currentText;
  ta.maxLength = MAX;

  const actionsEl = document.createElement('div');
  actionsEl.className = 'input-actions';

  const saveBtn = document.createElement('button');
  saveBtn.className = 'pin-btn';
  saveBtn.textContent = 'Save';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'cancel-btn';
  cancelBtn.textContent = 'Cancel';

  const counter = document.createElement('span');
  counter.className = 'char-counter';
  counter.textContent = `${currentText.length}/${MAX}`;

  ta.addEventListener('input', () => {
    counter.textContent = `${ta.value.length}/${MAX}`;
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  });

  function saveEdit() {
    const newText = ta.value.trim();
    if (newText.length < MIN_LETTERS) return;
    const goals = loadGoals();
    const idx = goals.findIndex(g => g.id === id);
    if (idx !== -1) { goals[idx].text = newText; saveGoals(goals); }
    card.querySelector('.goal-text').textContent = newText;
    editRow.remove();
    card.style.display = '';
  }
  function cancelEdit() { editRow.remove(); card.style.display = ''; }

  saveBtn.addEventListener('click', saveEdit);
  cancelBtn.addEventListener('click', cancelEdit);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(); }
    if (e.key === 'Escape') cancelEdit();
  });

  actionsEl.appendChild(counter);
  actionsEl.appendChild(saveBtn);
  actionsEl.appendChild(cancelBtn);
  editRow.appendChild(ta);
  editRow.appendChild(actionsEl);
  card.style.display = 'none';
  card.after(editRow);
  ta.focus();
  setTimeout(() => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }, 0);
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

function exportGoalsToFile() {
  const goals = loadGoals();
  const blob = new Blob([JSON.stringify(goals, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'goals.json'; a.click();
  URL.revokeObjectURL(url);
}

const importFileInput = document.getElementById('importFileInput');
function triggerImportFilePicker() {
  importFileInput.value = '';
  importFileInput.click();
}

importFileInput.addEventListener('change', () => {
  const file = importFileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let imported;
    try { imported = JSON.parse(e.target.result); }
    catch (err) { showErrorToast('parsing imported file', err); return; }
    if (!Array.isArray(imported) || imported.some(g => typeof g.text !== 'string')) {
      showToast("This doesn't look like a valid goals.json file.", 'error'); return;
    }
    const existing = loadGoals();
    if (existing.length > 0) showImportConfirmModal(imported);
    else doImport(imported);
  };
  reader.readAsText(file);
});

function doImport(goals) {
  try {
    const normalised = goals.map(g => ({
      id: g.id || Date.now().toString() + Math.random(),
      text: g.text.slice(0, MAX)
    }));
    saveGoals(normalised);
    getCards().forEach(c => c.remove());
    normalised.forEach(g => renderGoal(g.text, g.id));
    showToast('Imported goals', 'success');
  } catch (err) {
    showErrorToast('importing goals', err);
  }
}

function deleteAllGoalsData() {
  try { localStorage.removeItem(MT_STORAGE_KEY); } catch (e) {}
  try { localStorage.removeItem(MT_PROGRESS_KEY); } catch (e) {}
  try { localStorage.removeItem(MT_FOLDERS_KEY); } catch (e) {}
  getCards().forEach(c => c.remove());
  container.querySelectorAll('.folder-card').forEach(el => el.remove());
  updateDragHandles();
  updateEmptyState();
}

function resetCustomThemes() {
  const customIds = Object.keys(MTThemes.loadCustomThemes());
  const activeId = MTThemes.getActiveTheme();
  customIds.forEach(id => MTThemes.deleteCustomTheme(id));
  if (customIds.includes(activeId)) {
    themeLabel.textContent = MTThemes.THEMES.default.name;
  }
}

function showImportConfirmModal(pendingGoals) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const p = document.createElement('p');
  p.innerHTML = 'You already have goals, importing these goals will <span class="override-word">override</span> the existing goals. Are you sure?';
  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const noBtn = document.createElement('button');
  noBtn.className = 'modal-no-btn'; noBtn.textContent = 'No!';
  const yesBtn = document.createElement('button');
  yesBtn.className = 'modal-yes-btn'; yesBtn.textContent = 'Yes!';
  noBtn.addEventListener('click', () => overlay.remove());
  yesBtn.addEventListener('click', () => { overlay.remove(); doImport(pendingGoals); });
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  actions.appendChild(noBtn); actions.appendChild(yesBtn);
  box.appendChild(p); box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function openFolderCreateModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const box = document.createElement('div');
  box.className = 'folder-modal-box';

  overlay.appendChild(box);
  document.body.appendChild(overlay);

  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', esc); }
  });

  renderFolderNameStep(box, overlay);
}

function renderFolderNameStep(box, overlay) {
  box.innerHTML = '';

  const title = document.createElement('div');
  title.className = 'folder-modal-title';
  title.textContent = 'Make a folder';

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'folder-name-input';
  input.placeholder = 'Folder name...';
  input.maxLength = 50;

  const counter = document.createElement('div');
  counter.className = 'folder-name-counter';
  counter.textContent = `0/50`;

  input.addEventListener('input', () => {
    counter.textContent = `${input.value.length}/50`;
  });

  const actions = document.createElement('div');
  actions.className = 'folder-modal-actions';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'modal-no-btn';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', () => overlay.remove());

  const nextBtn = document.createElement('button');
  nextBtn.className = 'modal-yes-btn';
  nextBtn.textContent = 'Next';
  nextBtn.addEventListener('click', () => {
    const name = input.value.trim().slice(0, 50);
    if (!name) { input.focus(); return; }
    renderFolderPickerStep(box, overlay, name);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); nextBtn.click(); }
    if (e.key === 'Escape') overlay.remove();
  });

  actions.appendChild(cancelBtn);
  actions.appendChild(nextBtn);
  box.appendChild(title);
  box.appendChild(input);
  box.appendChild(counter);
  box.appendChild(actions);
  input.focus();
}

function renderFolderPickerStep(box, overlay, folderName) {
  box.innerHTML = '';

  const title = document.createElement('div');
  title.className = 'folder-modal-title';
  title.textContent = folderName;

  const list = document.createElement('div');
  list.className = 'folder-picker-list';

  const allGoals = loadGoals();
  const groupedGoalIds = new Set(loadFolders().flatMap(f => f.goalIds));
  const selected = new Set();

  if (allGoals.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'folder-picker-empty';
    empty.textContent = 'No goals yet to add.';
    list.appendChild(empty);
  } else {
    allGoals.forEach(g => {
      const row = document.createElement('div');
      row.className = 'folder-picker-row';

      const checkbox = document.createElement('div');
      checkbox.className = 'folder-picker-checkbox';
      checkbox.innerHTML = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12L9 17L20 6" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>';

      const text = document.createElement('span');
      text.className = 'folder-picker-text';
      text.textContent = g.text;

      row.appendChild(checkbox);
      row.appendChild(text);

      if (groupedGoalIds.has(g.id)) {
        const warning = document.createElement('span');
        warning.className = 'goal-in-folder-warning';
        warning.title = 'Already in another folder';
        warning.innerHTML = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 9V13M12 17H12.01M10.29 3.86L1.82 18A2 2 0 0 0 3.55 21H20.45A2 2 0 0 0 22.18 18L13.71 3.86A2 2 0 0 0 10.29 3.86Z" stroke="#e2b714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
        row.appendChild(warning);
      }

      row.addEventListener('click', () => {
        if (selected.has(g.id)) {
          selected.delete(g.id);
          row.classList.remove('checked');
        } else {
          selected.add(g.id);
          row.classList.add('checked');
        }
      });

      list.appendChild(row);
    });
  }

  const actions = document.createElement('div');
  actions.className = 'folder-modal-actions';

  const backBtn = document.createElement('button');
  backBtn.className = 'folder-back-btn';
  backBtn.textContent = 'Back';
  backBtn.addEventListener('click', () => renderFolderNameStep(box, overlay));

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'modal-no-btn';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', () => overlay.remove());

  const createBtn = document.createElement('button');
  createBtn.className = 'modal-yes-btn';
  createBtn.textContent = 'Create';
  createBtn.addEventListener('click', () => {
    const addedGoalIds = [...selected];
    createFolder(folderName, addedGoalIds);
    overlay.remove();
    addedGoalIds.forEach(goalId => {
      const flatCard = container.querySelector(`.goal-card[data-id="${goalId}"]`);
      if (flatCard) flatCard.remove();
    });
    renderAllFolders();
    updateDragHandles();
    updateEmptyState();
  });

  actions.appendChild(backBtn);
  actions.appendChild(cancelBtn);
  actions.appendChild(createBtn);
  box.appendChild(title);
  box.appendChild(list);
  box.appendChild(actions);
}

function openHistoryModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const box = document.createElement('div');
  box.className = 'history-modal-box';

  overlay.appendChild(box);
  document.body.appendChild(overlay);

  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', esc); }
  });

  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();

  const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  const WEEKDAY_NAMES = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

  function render() {
    box.innerHTML = '';

    const header = document.createElement('div');
    header.className = 'history-header';

    const prevBtn = document.createElement('button');
    prevBtn.className = 'history-nav-btn';
    prevBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
    prevBtn.addEventListener('click', () => {
      viewMonth--;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      render();
    });

    const label = document.createElement('div');
    label.className = 'history-month-label';
    label.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

    const nextBtn = document.createElement('button');
    nextBtn.className = 'history-nav-btn';
    nextBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
    nextBtn.addEventListener('click', () => {
      viewMonth++;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      render();
    });

    header.appendChild(prevBtn);
    header.appendChild(label);
    header.appendChild(nextBtn);
    box.appendChild(header);

    const weekdayRow = document.createElement('div');
    weekdayRow.className = 'history-weekdays';
    WEEKDAY_NAMES.forEach(w => {
      const el = document.createElement('div');
      el.className = 'history-weekday';
      el.textContent = w;
      weekdayRow.appendChild(el);
    });
    box.appendChild(weekdayRow);

    const grid = document.createElement('div');
    grid.className = 'history-grid';

    const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for (let i = 0; i < firstWeekday; i++) {
      const spacer = document.createElement('div');
      spacer.className = 'history-day empty';
      grid.appendChild(spacer);
    }

    let anyCompletionThisMonth = false;

    for (let day = 1; day <= daysInMonth; day++) {
      const completions = getCompletionsForDate(viewYear, viewMonth, day);
      const cell = document.createElement('div');
      cell.className = 'history-day';
      cell.textContent = day;

      if (completions.length > 0) {
        anyCompletionThisMonth = true;
        cell.classList.add('has-completion');
        const tooltip = document.createElement('div');
        tooltip.className = 'history-day-tooltip';
        tooltip.textContent = completions.length === 1
          ? `Completed ${completions[0].text}`
          : `Completed ${completions.length} goals`;
        cell.appendChild(tooltip);
      }

      grid.appendChild(cell);
    }

    box.appendChild(grid);

    if (!anyCompletionThisMonth) {
      const note = document.createElement('div');
      note.className = 'history-empty-note';
      note.textContent = 'No completions this month.';
      box.appendChild(note);
    }
  }

  render();
}

function openSettingsModal() {

    const config = loadCustomButtonConfig();

  box.appendChild(dataSection);

function buildSettingsActionRow(label, sublabel, btnText, onClick) {
  const row = document.createElement('div');
  row.className = 'settings-action-row';

  const textWrap = document.createElement('div');
  const labelEl = document.createElement('div');
  labelEl.className = 'settings-action-label';
  labelEl.textContent = label;
  const subEl = document.createElement('div');
  subEl.className = 'settings-action-sublabel';
  subEl.textContent = sublabel;
  textWrap.appendChild(labelEl);
  textWrap.appendChild(subEl);

  const btn = document.createElement('button');
  btn.className = 'settings-action-btn';
  btn.textContent = btnText;
  btn.addEventListener('click', onClick);

  row.appendChild(textWrap);
  row.appendChild(btn);
  return row;
}

function buildSettingsToggleRow(label, sublabel, initialOn, onChange) {
  const row = document.createElement('div');
  row.className = 'settings-action-row';

  const textWrap = document.createElement('div');
  const labelEl = document.createElement('div');
  labelEl.className = 'settings-action-label';
  labelEl.textContent = label;
  const subEl = document.createElement('div');
  subEl.className = 'settings-action-sublabel';
  subEl.textContent = sublabel;
  textWrap.appendChild(labelEl);
  textWrap.appendChild(subEl);

  const toggle = document.createElement('button');
  toggle.className = 'settings-toggle';
  let isOn = initialOn;
  if (isOn) toggle.classList.add('on');

  toggle.addEventListener('click', () => {
    isOn = !isOn;
    toggle.classList.toggle('on', isOn);
    onChange(isOn);
  });

  row.appendChild(textWrap);
  row.appendChild(toggle);
  return row;
}

function buildSettingsConfirmRow(label, sublabel, btnText, confirmText, onConfirm) {
  const row = document.createElement('div');
  row.className = 'settings-action-row';

  const textWrap = document.createElement('div');
  const labelEl = document.createElement('div');
  labelEl.className = 'settings-action-label';
  labelEl.textContent = label;
  const subEl = document.createElement('div');
  subEl.className = 'settings-action-sublabel';
  subEl.textContent = sublabel;
  textWrap.appendChild(labelEl);
  textWrap.appendChild(subEl);

  const btn = document.createElement('button');
  btn.className = 'settings-action-btn danger';
  btn.textContent = btnText;
  btn.addEventListener('click', () => {
    showDestructiveConfirmModal(confirmText, onConfirm);
  });

  row.appendChild(textWrap);
  row.appendChild(btn);
  return row;
}

function showDestructiveConfirmModal(message, onConfirm) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const p = document.createElement('p');
  p.innerHTML = message.replace(
    /cannot be undone/,
    '<span class="override-word">cannot be undone</span>'
  );
  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const noBtn = document.createElement('button');
  noBtn.className = 'modal-no-btn'; noBtn.textContent = 'Cancel';
  const yesBtn = document.createElement('button');
  yesBtn.className = 'modal-yes-btn'; yesBtn.textContent = 'Confirm';
  noBtn.addEventListener('click', () => overlay.remove());
  yesBtn.addEventListener('click', () => { overlay.remove(); onConfirm(); });
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  actions.appendChild(noBtn); actions.appendChild(yesBtn);
  box.appendChild(p); box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

settingsBtn.addEventListener('click', () => openSettingsModal());

document.getElementById('topbarSettingsBtn').addEventListener('click', () => openSettingsModal());
document.getElementById('topbarDiscordBtn').addEventListener('click', () => {
  window.open('https://discord.gg/Pn6B28fPg6', '_blank', 'noopener,noreferrer');
});

function openThemeModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const box = document.createElement('div');
  box.className = 'theme-modal-box';

  overlay.appendChild(box);
  document.body.appendChild(overlay);

  overlay.addEventListener('click', e => {
    if (e.target === overlay) {
      if (overlay.restoreActiveThemeOnClose) overlay.restoreActiveThemeOnClose();
      overlay.remove();
    }
  });
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') {
      if (overlay.restoreActiveThemeOnClose) overlay.restoreActiveThemeOnClose();
      overlay.remove();
      document.removeEventListener('keydown', esc);
    }
  });

  renderThemeListStep(box, overlay);
}

function openAutomaticModeModal(box, overlay) {
  box.innerHTML = '';

  const title = document.createElement('div');
  title.className = 'folder-modal-title';
  title.textContent = 'Automatic';

  const desc = document.createElement('div');
  desc.style.color = 'var(--mt-text-tertiary)';
  desc.style.fontSize = '0.8rem';
  desc.style.marginBottom = '14px';
  desc.textContent = 'Choose how Automatic decides between Default Dark and Default Light.';

  const list = document.createElement('div');
  list.className = 'theme-list';

  const currentMode = MTThemes.getAutomaticMode();

  const modes = [
    { id: 'time', label: 'Time based', sub: 'Light from 7:00 to 20:00, dark the rest of the day' },
    { id: 'os', label: 'OS Theme', sub: 'Matches your system\u2019s light or dark mode setting' },
  ];

  modes.forEach(mode => {
    const row = document.createElement('div');
    row.className = 'theme-list-row';
    if (mode.id === currentMode) row.classList.add('active');

    const textWrap = document.createElement('div');
    textWrap.style.flex = '1';
    const label = document.createElement('div');
    label.style.fontSize = '0.84rem';
    label.style.color = 'var(--mt-text-secondary)';
    label.textContent = mode.label;
    const sub = document.createElement('div');
    sub.style.fontSize = '0.72rem';
    sub.style.color = 'var(--mt-text-faint)';
    sub.style.marginTop = '2px';
    sub.textContent = mode.sub;
    textWrap.appendChild(label);
    textWrap.appendChild(sub);
    row.appendChild(textWrap);

    row.addEventListener('click', () => {
      MTThemes.setAutomaticMode(mode.id);
      MTThemes.setTheme('automatic');
      themeLabel.textContent = MTThemes.THEMES.automatic.name;
      overlay.remove();
    });

    list.appendChild(row);
  });

  const backBtn = document.createElement('button');
  backBtn.className = 'folder-back-btn';
  backBtn.textContent = 'Back';
  backBtn.style.marginTop = '14px';
  backBtn.addEventListener('click', () => renderThemeListStep(box, overlay));

  box.appendChild(title);
  box.appendChild(desc);
  box.appendChild(list);
  box.appendChild(backBtn);
}

function renderThemeListStep(box, overlay) {
  box.innerHTML = '';

  const activeIdAtOpen = MTThemes.getActiveTheme();

  const ALL_THEME_VAR_KEYS = [
    '--mt-accent', '--mt-accent-hover', '--mt-accent-muted',
    '--mt-bg-primary', '--mt-bg-card', '--mt-bg-card-hover',
    '--mt-text-primary', '--mt-text-secondary', '--mt-text-tertiary', '--mt-text-faint',
  ];

  function previewThemeVars(theme) {
    const root = document.documentElement;
    const fallbackTiers = MTThemes.relativeLuminance(theme['--mt-bg-primary'] || '#313338') > 0.5
      ? MTThemes.LIGHT_TEXT_TIERS
      : MTThemes.DARK_TEXT_TIERS;
    ALL_THEME_VAR_KEYS.forEach(key => {
      const val = theme[key] || fallbackTiers[key] || MTThemes.THEMES.default[key];
      if (val) root.style.setProperty(key, val);
    });
  }

  function restoreActiveTheme() {
    MTThemes.applyTheme(activeIdAtOpen);
  }

  overlay.restoreActiveThemeOnClose = restoreActiveTheme;

  const searchInput = document.createElement('input');
  searchInput.type = 'text';
  searchInput.className = 'theme-search-input';
  searchInput.placeholder = 'Search themes...';

  const customLink = document.createElement('button');
  customLink.className = 'theme-make-custom-link';
  customLink.textContent = '+ Make custom theme';
  customLink.addEventListener('click', () => renderThemeBuilderStep(box, overlay, null));

  const list = document.createElement('div');
  list.className = 'theme-list';

  function draw(filterText) {
    list.innerHTML = '';
    const allThemes = MTThemes.getAllThemes();
    const customThemeIds = new Set(Object.keys(MTThemes.loadCustomThemes()));
    const activeId = MTThemes.getActiveTheme();
    const query = (filterText || '').trim().toLowerCase();

    const entries = Object.entries(allThemes).filter(([id, theme]) => {
      if (!query) return true;
      const nameMatch = theme.name.toLowerCase().includes(query);
      const hexMatch = theme['--mt-accent'].toLowerCase().includes(query.replace('#', ''));
      return nameMatch || hexMatch;
    });

    if (entries.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'theme-list-empty';
      empty.textContent = 'No themes match.';
      list.appendChild(empty);
      return;
    }

    entries.forEach(([id, theme]) => {
      const row = document.createElement('div');
      row.className = 'theme-list-row';
      if (id === activeId) row.classList.add('active');

      const swatch = document.createElement('div');
      swatch.className = 'theme-swatch';
      if (id === 'automatic') {
        const darkAccent = MTThemes.THEMES.default['--mt-accent'];
        const lightAccent = MTThemes.THEMES['default-light']['--mt-accent'];
        swatch.style.background = `linear-gradient(135deg, ${darkAccent} 50%, ${lightAccent} 50%)`;
      } else {
        swatch.style.background = `linear-gradient(135deg, ${theme['--mt-accent']} 50%, ${theme['--mt-bg-primary']} 50%)`;
      }

      const name = document.createElement('span');
      name.className = 'theme-list-name';
      name.textContent = theme.name;

      row.appendChild(swatch);
      row.appendChild(name);

      const isCustom = customThemeIds.has(id);

      if (isCustom) {
        const actions = document.createElement('div');
        actions.className = 'theme-list-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'theme-list-icon-btn';
        editBtn.title = 'Edit theme';
        editBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M8.56078 20.2501L20.5608 8.25011L15.7501 3.43945L3.75012 15.4395V20.2501H8.56078ZM15.7501 5.56077L18.4395 8.25011L16.5001 10.1895L13.8108 7.50013L15.7501 5.56077ZM12.7501 8.56079L15.4395 11.2501L7.93946 18.7501H5.25012L5.25012 16.0608L12.7501 8.56079Z" fill="currentColor"></path></svg>`;
        editBtn.addEventListener('click', e => {
          e.stopPropagation();
          renderThemeBuilderStep(box, overlay, id);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'theme-list-icon-btn';
        deleteBtn.title = 'Delete theme';
        deleteBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6H20L18.4199 20.2209C18.3074 21.2337 17.4512 22 16.4321 22H7.56786C6.54876 22 5.69264 21.2337 5.5801 20.2209L4 6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M7.34491 3.14716C7.67506 2.44685 8.37973 2 9.15396 2H14.846C15.6203 2 16.3249 2.44685 16.6551 3.14716L18 6H6L7.34491 3.14716Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M2 6H22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10 11V16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M14 11V16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
        deleteBtn.addEventListener('click', e => {
          e.stopPropagation();
          showDestructiveConfirmModal(
            `Are you sure you want to delete "${theme.name}"? This cannot be undone.`,
            () => {
              try {
                MTThemes.deleteCustomTheme(id);
                if (id === activeId) {
                  themeLabel.textContent = MTThemes.THEMES.default.name;
                }
                draw(searchInput.value);
                showToast('Deleted custom theme', 'success');
              } catch (err) {
                showErrorToast('deleting custom theme', err);
              }
            }
          );
        });

        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);
        row.appendChild(actions);
      } else {
        const tag = document.createElement('span');
        tag.className = 'theme-list-tag';
        tag.textContent = 'built-in';
        row.appendChild(tag);
      }

      if (id !== 'automatic') {
        row.addEventListener('mouseenter', () => previewThemeVars(theme));
        row.addEventListener('mouseleave', () => restoreActiveTheme());
      }

      row.addEventListener('click', () => {
        if (id === 'automatic') {
          openAutomaticModeModal(box, overlay);
          return;
        }
        overlay.restoreActiveThemeOnClose = null;
        MTThemes.setTheme(id);
        themeLabel.textContent = theme.name;
        overlay.remove();
      });

      list.appendChild(row);
    });
  }

  searchInput.addEventListener('input', () => draw(searchInput.value));

  box.appendChild(searchInput);
  box.appendChild(customLink);
  box.appendChild(list);
  draw('');
  searchInput.focus();
}

function renderThemeBuilderStep(box, overlay, editingId) {
  box.innerHTML = '';

  const existing = editingId ? MTThemes.getAllThemes()[editingId] : null;

  const title = document.createElement('div');
  title.className = 'folder-modal-title';
  title.textContent = editingId ? 'Edit custom theme' : 'Make custom theme';

  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.className = 'theme-builder-name-input';
  nameInput.placeholder = 'Theme name...';
  nameInput.maxLength = 40;
  nameInput.value = existing ? existing.name : '';

  function colorField(labelText, defaultHex) {
    const field = document.createElement('div');
    field.className = 'theme-builder-field';
    const label = document.createElement('label');
    label.className = 'theme-builder-label';
    label.textContent = labelText;
    const row = document.createElement('div');
    row.className = 'theme-builder-row';
    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.value = defaultHex;
    const textInput = document.createElement('input');
    textInput.type = 'text';
    textInput.value = defaultHex;
    textInput.maxLength = 7;
    colorInput.addEventListener('input', () => { textInput.value = colorInput.value; });
    textInput.addEventListener('input', () => {
      const v = textInput.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(v)) colorInput.value = v;
    });
    row.appendChild(colorInput);
    row.appendChild(textInput);
    field.appendChild(label);
    field.appendChild(row);
    return { field, colorInput, textInput };
  }

  const bg = colorField('Background color', existing ? existing['--mt-bg-primary'] : '#313338');
  const card = colorField('Card background', existing ? existing['--mt-bg-card'] : '#2b2d31');
  const cardHover = colorField('Card background (hover)', existing ? existing['--mt-bg-card-hover'] : '#35373d');
  const accent = colorField('Accent color', existing ? existing['--mt-accent'] : '#e2b714');

  const actions = document.createElement('div');
  actions.className = 'folder-modal-actions';

  const backBtn = document.createElement('button');
  backBtn.className = 'folder-back-btn';
  backBtn.textContent = 'Back';
  backBtn.addEventListener('click', () => renderThemeListStep(box, overlay));

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'modal-no-btn';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', () => overlay.remove());

  const saveBtn = document.createElement('button');
  saveBtn.className = 'modal-yes-btn';
  saveBtn.textContent = editingId ? 'Save' : 'Create';
  saveBtn.addEventListener('click', () => {
    const name = nameInput.value.trim().slice(0, 40);
    if (!name) { nameInput.focus(); return; }
    const values = {
      themeName: name,
      backgroundColor: bg.colorInput.value,
      cardBackgroundColor: card.colorInput.value,
      cardBackgroundHoverColor: cardHover.colorInput.value,
      accentColor: accent.colorInput.value,
    };
    const id = editingId || ('custom_' + Date.now().toString());
    try {
      MTThemes.saveCustomTheme(id, values);
      if (MTThemes.getActiveTheme() === id) {
        MTThemes.applyTheme(id);
        themeLabel.textContent = name;
      }
      renderThemeListStep(box, overlay);
      showToast(editingId ? 'Saved theme edits' : 'Created custom theme!', 'success');
    } catch (err) {
      showErrorToast('saving custom theme', err);
    }
  });

  actions.appendChild(backBtn);
  actions.appendChild(cancelBtn);
  actions.appendChild(saveBtn);

  box.appendChild(title);
  box.appendChild(nameInput);
  box.appendChild(bg.field);
  box.appendChild(card.field);
  box.appendChild(cardHover.field);
  box.appendChild(accent.field);
  box.appendChild(actions);
  nameInput.focus();
}
